# What is left of the old layout file: one number.
#
# What Eugene needs -- somewhere to propose, somewhere to vote, somewhere to
# publish the result, the archive -- is generated from the features a server
# has switched on, in `modules.py`, and `/setup` is the only route that
# builds it. The hangout that used to live here (general, memes, pets, six
# voice channels) was a description of one particular server, and adding
# channels to a server that did not ask for them is how the first install
# went wrong.

# The backstop only: a vote now ends as soon as its result is settled, so this
# is the deadline for one nobody finishes. It stays here because CONTRIBUTING
# tells people to wind it down to seconds for a sandbox run, and that has to
# work before a server has been configured at all. It is a default, not the
# rule: a house that sets its own window in `/setup` outranks it.
